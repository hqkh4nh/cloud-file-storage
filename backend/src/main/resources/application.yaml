spring:
  application:
    name: backend
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  servlet:
    context-path: /api

app:
  storage:
    endpoint: ${S3_ENDPOINT}
    public-endpoint: ${S3_PUBLIC_ENDPOINT}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health